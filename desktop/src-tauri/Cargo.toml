[package]
name = "hestia-desktop"
version = "0.1.0"
description = "Casca desktop do Hestia (Tauri v2)"
authors = ["Hestia"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# Biblioteca separada do binário: a lógica (janela, atualizador) fica em lib.rs.
[lib]
name = "hestia_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde_json = "1"
sys-locale = "0.3"
