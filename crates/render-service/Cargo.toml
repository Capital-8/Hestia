[package]
name = "render-service"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Serviço local do renderizador GPU nativo do Hestia (wgpu)."

[[bin]]
name = "render-service"
path = "src/main.rs"

[dependencies]
render-core = { path = "../render-core" }
render-native = { path = "../render-native" }
tiny_http = "0.12"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
