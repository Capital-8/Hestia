[package]
name = "render-pt0"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Protótipo de rastreamento de caminhos na GPU (fatia 0): BVH, travessia em compute WGSL, sombra do sol e acumulação em RGBA32F. Não é o render de produção."

[lib]
name = "render_pt0"
path = "src/lib.rs"

[dependencies]
# Cena, câmera, matrizes, ruído e tone mapping vêm do núcleo compartilhado (referência em CPU).
render-core = { path = "../render-core" }
# Mesmas versões de render-engine (Cargo.lock copiado para manter o mesmo wgpu).
wgpu = "30"
pollster = "1"
bytemuck = { version = "1.25", features = ["derive"] }
png = "0.17"
