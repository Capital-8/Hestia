[package]
name = "render-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "ABI WebAssembly do renderizador offline do Hestia."

[lib]
# `cdylib` gera o `.wasm`; `rlib` permite testar a ABI no host, sem wasm.
crate-type = ["cdylib", "rlib"]

[dependencies]
render-core = { path = "../render-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
