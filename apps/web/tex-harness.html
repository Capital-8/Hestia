<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff"><canvas id="c" width="1200" height="400"></canvas>
<script type="module">
import { obterRenderer, liberarRenderer, criarCena } from '/src/ui/dialogs/materials/cenaMaterial3d.ts';
import { carregarCatalogo } from '/src/editor/texturasOnline.ts';
import { texturas3d } from '/src/editor/texturas3d.ts';
const id = new URLSearchParams(location.search).get('t') || 'Onyx001';
await carregarCatalogo();
const out = document.getElementById('c').getContext('2d');
const P = 400;
const mat = { id: 'm', name: id, color: '#b9a98f', hatch: 'none', gloss: 0.2, opacity: 1, cost: 0, unit: 'm2', aparencia: { textura: { imagemId: 'catalogo:' + id, escalaMetros: 1, rotacao: 0, deslocamento: [0, 0], repetir: true } } };
const fase = (col) => {
  const { renderer, env } = obterRenderer();
  renderer.setPixelRatio(1); renderer.setSize(P, P, false);
  const cena = criarCena(env, 'sphere', mat, false);
  cena.aplicarMaterial(mat); cena.girar(0.3, 0.2); renderer.render(cena.scene, cena.camera);
  out.drawImage(renderer.domElement, col * P, 0, P, P);
  return cena;
};
// 1) abre: textura ainda baixando -> carrega -> reaplica
let c1 = fase(0);
await new Promise((r) => { const off = texturas3d.aoMudar(() => { off(); r(); }); c1.aplicarMaterial(mat); });
const { renderer } = obterRenderer(); liberarRenderer(); // (compensa o uso extra)
c1.aplicarMaterial(mat); c1.girar(0.3, 0.2); renderer.render(c1.scene, c1.camera);
out.drawImage(renderer.domElement, P, 0, P, P);
// 2) fecha o diálogo e reabre: renderer novo, textura já em memória
c1.dispose(); liberarRenderer();
let c2 = fase(2);
window.__done = 'ok';
</script>
