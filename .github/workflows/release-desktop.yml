name: release-desktop

# Gera o instalador Windows do Hestia (Tauri) e publica no GitHub Releases.
# Como publicar: veja docs/desktop.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Instalar toolchain Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências da raiz
        run: npm ci

      - name: Gerar o app web (apps/web/dist)
        run: npm run build

      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm ci

      - name: Conferir que a tag e as versões batem
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A execução precisa ser de uma tag vX.Y.Z (ref atual: '$REF_NAME'). Em execução manual, escolha a tag no seletor de branch/tag."
            exit 1
          fi
          tag_versao="${REF_NAME#v}"
          versao_tauri=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          versao_raiz=$(node -p "require('./package.json').version")
          echo "tag: $tag_versao | desktop/src-tauri/tauri.conf.json: $versao_tauri | package.json (raiz): $versao_raiz"
          if [[ "$tag_versao" != "$versao_tauri" || "$tag_versao" != "$versao_raiz" ]]; then
            echo "::error::Versões diferentes: tag=$tag_versao, tauri.conf.json=$versao_tauri, package.json=$versao_raiz. Suba a versão nos dois arquivos antes de criar a tag."
            exit 1
          fi

      - name: Preparar notas da versão
        id: notas
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          arquivo="docs/releases/${REF_NAME}.md"
          if [[ -f "$arquivo" ]]; then
            {
              echo "body<<FIM_DAS_NOTAS"
              cat "$arquivo"
              echo "FIM_DAS_NOTAS"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=Instalador para Windows. Notas desta versão ainda não foram escritas." >> "$GITHUB_OUTPUT"
          fi

      - name: Empacotar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Hestia ${{ github.ref_name }}
          releaseBody: ${{ steps.notas.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # O site (repo `hestia-web`) publica o /app copiando exatamente estes assets: o HTML carrega a
      # meta `hestia-version` (carimbada no build) e os workers/wasm ficam ao lado dele, com os nomes
      # que o próprio bundle referencia. Nomes sem versão no asset: o pacote é por release.
      - name: Publicar app web no Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for padrao in resolveWorker avisosWorker ifcWorker; do
            compgen -G "apps/web/dist/${padrao}-*.js" > /dev/null || {
              echo "::error::worker ${padrao} ausente em apps/web/dist"
              exit 1
            }
          done
          [[ -f apps/web/dist/geom_wasm.wasm ]] || {
            echo "::error::geom_wasm.wasm ausente em apps/web/dist"
            exit 1
          }

          versao_no_html="$(grep -o 'name="hestia-version" content="[^"]*"' apps/web/dist/index.html | sed 's/.*content="//; s/"$//')"
          if [[ "v${versao_no_html}" != "$TAG" ]]; then
            echo "::error::meta hestia-version='${versao_no_html}' não bate com a tag '$TAG'"
            exit 1
          fi

          shopt -s nullglob
          arquivos=(apps/web/dist/index.html apps/web/dist/geom_wasm.wasm apps/web/dist/*Worker-*.js)
          gh release upload "$TAG" "${arquivos[@]}" --clobber
          echo "app web publicado em $TAG: ${arquivos[*]}"
